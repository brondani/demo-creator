name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'brondani/demo-creator' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Validate release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(./demo --version)" = "demo ${TAG#v}+dev"
          status=$(curl -sS -o "$RUNNER_TEMP/release.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          if [ "$status" = 200 ]; then
            echo "Release $TAG already exists; refusing to replace its image or assets." >&2
            exit 1
          elif [ "$status" != 404 ]; then
            echo "Cannot check existing release (HTTP $status)." >&2
            exit 1
          fi
      - name: Test CLI
        run: |
          python3 -m unittest discover -s tests -v
          ./smoke.py --plan-only
      - name: Verify rootless Podman
        run: ./demo preflight
      - name: Build renderer
        run: podman build --pull=always -t localhost/demo-creator:1 -f Containerfile .
      - name: Download official VS Code for activation tests
        run: |
          curl -fsSL --retry 3 https://update.code.visualstudio.com/1.109.5/linux-x64/stable -o "$RUNNER_TEMP/vscode.tar.gz"
          echo "70160103c0dda50f651a37ee27a65a9a64a6938734cf1a0bcd49d83612bdb1a7  $RUNNER_TEMP/vscode.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/vscode"
          tar -xzf "$RUNNER_TEMP/vscode.tar.gz" -C "$RUNNER_TEMP/vscode" --strip-components=1
      - name: Smoke-test local renderer and artifact preparation
        run: ./smoke.py --vscode "$RUNNER_TEMP/vscode"
      - name: Collect corresponding Debian sources
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 scripts/collect_debian_sources.py \
            --image localhost/demo-creator:1 --output "$RUNNER_TEMP/debian-sources"
          mkdir "$RUNNER_TEMP/debian-sources/demo-creator"
          cp Containerfile renderer.py requirements-renderer.txt LICENSE "$RUNNER_TEMP/debian-sources/demo-creator/"
          tar -cf "dist/demo-creator-debian-sources-${TAG#v}.tar" -C "$RUNNER_TEMP" debian-sources
          if [ "$(stat -c %s "dist/demo-creator-debian-sources-${TAG#v}.tar")" -ge 2147483648 ]; then
            echo "Debian source archive exceeds the GitHub release asset size limit." >&2
            exit 1
          fi
      - name: Push tested image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          podman import --change 'LABEL org.opencontainers.image.source=https://github.com/brondani/demo-creator' \
            "dist/demo-creator-debian-sources-${TAG#v}.tar" localhost/demo-creator-sources:release
          podman push --digestfile "$RUNNER_TEMP/sources.digest" localhost/demo-creator-sources:release \
            "docker://ghcr.io/brondani/demo-creator:$TAG-sources"
          sources_digest=$(cat "$RUNNER_TEMP/sources.digest")
          [[ "$sources_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "sources=ghcr.io/brondani/demo-creator@$sources_digest" >> "$GITHUB_OUTPUT"
          podman push --digestfile "$RUNNER_TEMP/renderer.digest" localhost/demo-creator:1 \
            "docker://ghcr.io/brondani/demo-creator:$TAG"
          digest=$(cat "$RUNNER_TEMP/renderer.digest")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "ref=ghcr.io/brondani/demo-creator@$digest" >> "$GITHUB_OUTPUT"
      - name: Package and test the released CLI
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          python3 scripts/package_release.py --version "$version" --image "$IMAGE" --output dist
          podman pull "$IMAGE"
          tar -xzf "dist/demo-creator-$version.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/demo-creator-$version/demo" setup
          ./smoke.py --cli "$RUNNER_TEMP/demo-creator-$version/demo" --vscode "$RUNNER_TEMP/vscode"
          (cd dist && sha256sum "demo-creator-$version.tar.gz" \
            "demo-creator-debian-sources-$version.tar" > SHA256SUMS)
      - name: Verify anonymous image access
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          SOURCES: ${{ steps.image.outputs.sources }}
        shell: bash
        run: |
          set -euo pipefail
          if ! response=$(curl -fsS --get \
            --data-urlencode 'scope=repository:brondani/demo-creator:pull' \
            https://ghcr.io/token); then
            echo "Make the demo-creator container package public in GitHub Packages, then rerun this workflow for the tag." >&2
            exit 1
          fi
          token=$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          for ref in "$IMAGE" "$SOURCES"; do
            digest="${ref##*@}"
            if ! curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/brondani/demo-creator/manifests/$digest"; then
              echo "The image cannot be pulled anonymously; check package visibility and rerun this workflow." >&2
              exit 1
            fi
          done
      - name: Publish CLI release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.ref }}
          SOURCES: ${{ steps.image.outputs.sources }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag --title "demo-creator $TAG" \
            --notes "Tested renderer: $IMAGE
          Corresponding Debian sources: $SOURCES" dist/*.tar.gz dist/*.tar dist/SHA256SUMS
