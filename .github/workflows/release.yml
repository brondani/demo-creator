name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'brondani/demo-creator' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(./demo --version)" = "demo ${TAG#v}+dev"
          status=$(curl -sS -o "$RUNNER_TEMP/release.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          if [ "$status" = 200 ]; then
            echo "Release $TAG already exists; refusing to replace its image or assets." >&2
            exit 1
          elif [ "$status" != 404 ]; then
            echo "Cannot check existing release (HTTP $status)." >&2
            exit 1
          fi
      - name: Test CLI
        run: |
          python3 -m unittest discover -s tests -v
          ./smoke.py --plan-only
      - name: Verify rootless Podman
        run: ./demo preflight
      - name: Build renderer
        run: podman build --pull=always -t localhost/demo-creator:1 -f Containerfile .
      - name: Smoke-test local renderer
        run: ./smoke.py
      - name: Push tested image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          podman push --digestfile "$RUNNER_TEMP/renderer.digest" localhost/demo-creator:1 \
            "docker://ghcr.io/brondani/demo-creator:$TAG"
          digest=$(cat "$RUNNER_TEMP/renderer.digest")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "ref=ghcr.io/brondani/demo-creator@$digest" >> "$GITHUB_OUTPUT"
      - name: Package and test the released CLI
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          python3 scripts/package_release.py --version "$version" --image "$IMAGE" --output dist
          podman pull "$IMAGE"
          tar -xzf "dist/demo-creator-$version.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/demo-creator-$version/demo" setup
          ./smoke.py --cli "$RUNNER_TEMP/demo-creator-$version/demo"
          (cd dist && sha256sum "demo-creator-$version.tar.gz" > SHA256SUMS)
      - name: Verify anonymous image access
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if ! response=$(curl -fsS --get \
            --data-urlencode 'scope=repository:brondani/demo-creator:pull' \
            https://ghcr.io/token); then
            echo "Make the demo-creator container package public in GitHub Packages, then rerun this workflow for the tag." >&2
            exit 1
          fi
          token=$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          digest="${IMAGE##*@}"
          if ! curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/brondani/demo-creator/manifests/$digest"; then
            echo "The image cannot be pulled anonymously; check package visibility and rerun this workflow." >&2
            exit 1
          fi
      - name: Publish CLI release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.ref }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag --title "demo-creator $TAG" \
            --notes "Tested renderer: $IMAGE" dist/*.tar.gz dist/SHA256SUMS
