name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      sources:
        description: Download and verify the full Debian source bundle
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Test release packaging and setup
        run: python3 -m unittest discover -s tests -v
      - name: Test planning without a model call
        run: ./smoke.py --plan-only
  renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Verify rootless Podman
        run: ./demo preflight
      - name: Build renderer
        run: podman build --pull=always -t localhost/demo-creator:1 -f Containerfile .
      - name: Download official VS Code for the activation smoke test
        run: |
          curl -fsSL --retry 3 https://update.code.visualstudio.com/1.109.5/linux-x64/stable -o "$RUNNER_TEMP/vscode.tar.gz"
          echo "70160103c0dda50f651a37ee27a65a9a64a6938734cf1a0bcd49d83612bdb1a7  $RUNNER_TEMP/vscode.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/vscode"
          tar -xzf "$RUNNER_TEMP/vscode.tar.gz" -C "$RUNNER_TEMP/vscode" --strip-components=1
      - name: Smoke-test renderer and artifact preparation
        run: ./smoke.py --vscode "$RUNNER_TEMP/vscode"
      - name: Activate released CMSIS extensions offline
        run: |
          ./demo prepare --source https://github.com/Open-CMSIS-Pack/vscode-cmsis-solution/releases/download/v1.74.0/cmsis-csolution-linux-x64-1.74.0.vsix \
            --sha256 8cd2ea82f77b55f606285a94ed3bccd93746e24979185aad51987ca7e2eb1016 --vscode "$RUNNER_TEMP/vscode"
          ./demo prepare --source https://github.com/Open-CMSIS-Pack/vscode-cmsis-debugger/releases/download/v1.10.1/vscode-cmsis-debugger-linux-x64-1.10.1.vsix \
            --sha256 025db3174cb34b443aa9776a0dfadfea45ffe062f367e16287fe2bc4cee16185 --vscode "$RUNNER_TEMP/vscode"
      - name: Verify Debian source bundle
        if: ${{ inputs.sources }}
        run: |
          python3 scripts/collect_debian_sources.py \
            --image localhost/demo-creator:1 --output "$RUNNER_TEMP/debian-sources"
          mkdir "$RUNNER_TEMP/debian-sources/demo-creator"
          cp Containerfile renderer.py requirements-renderer.txt LICENSE "$RUNNER_TEMP/debian-sources/demo-creator/"
          tar -cf "$RUNNER_TEMP/debian-sources.tar" -C "$RUNNER_TEMP" debian-sources
          podman import "$RUNNER_TEMP/debian-sources.tar" localhost/demo-creator-sources:test
