name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      sources:
        description: Download and verify the full Debian source bundle
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Test release packaging and setup
        run: python3 -m unittest discover -s tests -v
      - name: Test planning without a model call
        run: ./smoke.py --plan-only
  renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Verify rootless Podman
        run: ./demo preflight
      - name: Build renderer
        run: podman build --pull=always -t localhost/demo-creator:1 -f Containerfile .
      - name: Smoke-test renderer
        run: ./smoke.py
      - name: Verify Debian source bundle
        if: ${{ inputs.sources }}
        run: |
          python3 scripts/collect_debian_sources.py \
            --image localhost/demo-creator:1 --output "$RUNNER_TEMP/debian-sources"
          mkdir "$RUNNER_TEMP/debian-sources/demo-creator"
          cp Containerfile renderer.py requirements-renderer.txt LICENSE "$RUNNER_TEMP/debian-sources/demo-creator/"
          tar -cf "$RUNNER_TEMP/debian-sources.tar" -C "$RUNNER_TEMP" debian-sources
          podman import "$RUNNER_TEMP/debian-sources.tar" localhost/demo-creator-sources:test
