name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test release packaging and setup
        run: python3 -m unittest discover -s tests -v
      - name: Test planning without a model call
        run: ./smoke.py --plan-only
  renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify rootless Podman
        run: ./demo preflight
      - name: Build renderer
        run: podman build --pull=always -t localhost/demo-creator:1 -f Containerfile .
      - name: Smoke-test renderer
        run: ./smoke.py
